<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gürses Veresiye</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gürses Veresiye">
<meta name="theme-color" content="#1C1C1C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#1A1A1A;--mute:#6B6B6B;--paper:#F4F2EE;--card:#FFFFFF;--line:#E6E2DA;--line2:#DDD8D0;--dark:#1C1C1C;--dark2:#2A2A2A;--acc:#F28C28;--acc-ink:#C2520A;--acc-bg:#FBE7DB;--red:#B5400C;--green:#2F7A3A;--green-bg:#DDF0E0;--blue:#1F3F6E;--blue-bg:#EEF3FA;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{width:100%;height:50px;border:1px solid var(--line2);border-radius:14px;background:var(--card);padding:0 14px;font-size:16px;outline:0}
textarea{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.3px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.hdr{background:var(--dark);color:#fff;padding:calc(var(--sat) + 14px) 18px 18px;display:flex;flex-direction:column;gap:14px}
.hdr .top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.hdr h1{margin:0;font-size:20px;font-weight:800}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:36px;height:36px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--dark)}
.brand .t1{font-size:15px;font-weight:800;letter-spacing:.4px}.brand .t2{font-size:12px;color:#B8B8B8}
.ib{width:44px;height:44px;border-radius:10px;background:var(--dark2);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ib.light{background:var(--card);border:1px solid var(--line2);color:var(--ink)}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--dark2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .k{font-size:11px;color:#B8B8B8;font-weight:700;letter-spacing:.3px}.stat .v{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat .s{font-size:11px;color:#B8B8B8}
.stat.warn{background:#5A2D00;border:1px solid #A25A17}.stat.warn .k,.stat.warn .s{color:#FFD9B8}
.main{flex:1;padding:16px 18px calc(var(--sab) + 180px);display:flex;flex-direction:column;gap:12px}
.main.nofab{padding-bottom:calc(var(--sab) + 110px)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h2{margin:0;font-size:16px;font-weight:800}.sec .lnk{font-size:14px;font-weight:700;color:var(--acc-ink);padding:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;text-align:left;width:100%}
.card.col{flex-direction:column;align-items:stretch;gap:10px}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.n{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-size:16px;font-weight:800;white-space:nowrap}.pos{color:var(--red)}.neg{color:var(--green)}.zero{color:var(--green)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:800}
.chip.o{background:var(--acc-bg);color:#8A3A05}.chip.b{background:var(--blue-bg);color:var(--blue)}.chip.g{background:var(--green-bg);color:var(--green)}.chip.r{background:#FBE1DC;color:var(--red)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:0 14px;height:48px}
.search input{border:0;height:auto;padding:0;background:transparent;border-radius:0}
.fab{position:fixed;left:18px;right:18px;bottom:calc(var(--sab) + 92px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5}
.fab .big{width:100%;height:60px;border-radius:20px;background:var(--acc);color:var(--dark);display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.fab .hint{font-size:12px;color:var(--mute);background:var(--paper);padding:0 6px}
.fab.two{flex-direction:row;gap:10px}.fab.two button{flex:1;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.bd{background:var(--dark);color:#fff}.bo{background:var(--acc);color:var(--dark)}.bg{background:var(--green);color:#fff}.bw{background:var(--card);border:1px solid var(--line2);color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(var(--sab) + 8px);z-index:6}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);height:52px;justify-content:center}
.tabs button.on{color:var(--acc-ink);font-weight:800}
.seg{display:flex;gap:4px;background:#E9E5DD;border-radius:12px;padding:4px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mute)}.seg button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.dk{background:var(--dark2)}.seg.dk button{color:#B8B8B8}.seg.dk button.on{background:var(--acc);color:var(--dark)}
.seg.sm button{height:30px;font-size:12px}
.btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;width:100%}
.btn.sm{height:44px;font-size:14px;border-radius:12px}
.quick{display:flex;gap:8px}.quick button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:700}.quick button.on{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:800}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pills button{height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:14px;font-weight:700}.pills button.on{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:800}
.big-in{display:flex;align-items:center;background:var(--card);border:2px solid var(--green);border-radius:16px;padding:0 16px;height:70px;gap:8px}.big-in input{border:0;height:auto;padding:0;font-size:34px;font-weight:800;background:transparent}.big-in span{font-size:26px;font-weight:800;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line);padding-bottom:2px}
.chart .g{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;min-width:0}.chart .b{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.chart .b.o{background:var(--acc)}.chart .b.g{background:var(--green)}.chart .b.r{background:#C9C2B6}
.xl{display:flex;gap:6px;font-size:10px;color:var(--mute);font-weight:700;text-align:center}.xl div{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.leg{display:flex;gap:12px;font-size:11px;font-weight:700;color:var(--mute)}.leg span{display:flex;align-items:center;gap:4px}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{display:flex;align-items:center;gap:10px;font-size:13px}.bar .l{width:96px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .t{flex:1;height:14px;background:var(--paper);border-radius:7px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--acc)}.bar .v{width:64px;text-align:right;font-weight:800}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .card{flex-direction:column;align-items:stretch;gap:2px}.kpi .k{font-size:11px;color:var(--mute);font-weight:700}.kpi .v{font-size:21px;font-weight:800}.kpi .s{font-size:11px;color:var(--mute);font-weight:700}
.kpi .card.dk{background:var(--dark);color:#fff;border-color:var(--dark)}.kpi .card.dk .k,.kpi .card.dk .s{color:#B8B8B8}
.empty{text-align:center;color:var(--mute);padding:28px 10px;font-size:14px;line-height:1.5}
.lst{display:flex;flex-direction:column;gap:8px}
.dl{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ECE8E1;font-size:14px}.dl:last-child{border-bottom:0}.dl b{font-weight:800;text-align:right}.dl span{color:var(--mute);font-weight:600}
.chk{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #F0ECE5}.chk:last-child{border-bottom:0}.chk input{width:22px;height:22px;flex:none;accent-color:var(--green)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sh{background:var(--paper);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sh .shh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;gap:10px}.sh .shh h3{margin:0;font-size:17px;font-weight:800}
.sh .shb{overflow:auto;padding:8px 18px calc(var(--sab) + 18px);display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sh.dk{background:var(--dark);color:#fff}.sh.dk .shh h3{color:#fff}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}@keyframes fi{from{opacity:0}to{opacity:1}}
.mic{width:120px;height:120px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;margin:8px auto 0;box-shadow:0 0 0 14px rgba(242,140,40,.18),0 0 0 28px rgba(242,140,40,.08);transition:transform .2s}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 10px rgba(242,140,40,.25),0 0 0 22px rgba(242,140,40,.1)}50%{box-shadow:0 0 0 18px rgba(242,140,40,.3),0 0 0 36px rgba(242,140,40,.12)}100%{box-shadow:0 0 0 10px rgba(242,140,40,.25),0 0 0 22px rgba(242,140,40,.1)}}
.said{background:var(--dark2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}.said .k{font-size:11px;color:#B8B8B8;font-weight:800;letter-spacing:.5px}.said textarea{background:transparent;border:1px solid #444;color:#fff;font-size:17px;font-weight:600;min-height:70px}
.parsed{background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 168px);transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90%;text-align:center}
.thumb{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#eee}
.up{height:84px;border-radius:14px;border:2px dashed #C9C2B6;background:var(--card);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mute);font-size:14px;font-weight:700;width:100%}
.note{font-size:12px;color:var(--mute);line-height:1.45}
.danger{color:var(--red)}
.mini{display:flex;align-items:flex-end;gap:5px;height:64px}.mini .g{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}.mini .g i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}.mini .g i.z{background:var(--line)}.mini .g b{font-size:9px;color:var(--mute);font-weight:700}
.h-ok{color:var(--green)}.h-due{color:var(--red)}
hr{border:0;border-top:1px solid var(--line);margin:0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<script>
/* ===================== Yardımcılar ===================== */
const $=(s,r=document)=>r.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>toISO(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return toISO(d)};
const AY=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const AYL=['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
const GUN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const fdate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return `${+d} ${AY[+m-1]} ${y}`};
const fdateS=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return `${+d} ${AY[+m-1]}`};
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('tr-TR',{maximumFractionDigits:2})+' ₺';
const num=v=>{if(typeof v==='number')return v;v=String(v??'').trim().replace(/\s/g,'').replace(/₺|tl/gi,'');if(/,\d{1,2}$/.test(v))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');else v=v.replace(/,/g,'');const n=parseFloat(v);return isNaN(n)?0:n};
const initials=c=>((c.ad||'')[0]||'')+((c.soyad||'')[0]||(c.firma||'')[0]||'');
const AVC=[['#FFE3CF','#8A3A05'],['#DCE8F7','#1F3F6E'],['#E2EFD9','#2F5A1E'],['#EDE4F5','#4F2D73'],['#FBE1DC','#8A2A14'],['#DFF2F1','#145A55']];
const avc=id=>{let s=0;for(const ch of String(id))s+=ch.charCodeAt(0);return AVC[s%AVC.length]};
const cname=c=>c?[c.ad,c.soyad].filter(Boolean).join(' ')||c.firma||'(isimsiz)':'(silinmiş müşteri)';
const twoTap=b=>{if(b.dataset.armed){return true}b.dataset.armed='1';b.dataset.old=b.textContent;b.textContent='Emin misiniz? Evet, sil';b.style.background='#FBE1DC';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.old;b.style.background=''}},3500);return false};
const toast=(t,ms=2200)=>{const r=$('#toastRoot');r.innerHTML=`<div class="toast">${h(t)}</div>`;clearTimeout(r._t);r._t=setTimeout(()=>r.innerHTML='',ms)};
const I={
 mic:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
 x:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 ok:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 phone:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
 bell:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
 users:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-5-6.7"/></svg>',
 fork:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V9h7l3 5v3M14 17h2V5h-3M16 11h4v6h-4"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>',
 wallet:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
 chart:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',

/* ===================== Depo (IndexedDB) ===================== */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('gurses-veresiye',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};r.onsuccess=e=>{DB.db=e.target.result;res()};r.onerror=()=>rej(r.error)})},
 get(store,key){return new Promise((res,rej)=>{const t=DB.db.transaction(store).objectStore(store).get(key);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
 set(store,key,val){return new Promise((res,rej)=>{const t=DB.db.transaction(store,'readwrite').objectStore(store).put(val,key);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})},
 del(store,key){return new Promise((res,rej)=>{const t=DB.db.transaction(store,'readwrite').objectStore(store).delete(key);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})},
 keys(store){return new Promise((res,rej)=>{const t=DB.db.transaction(store).objectStore(store).getAllKeys();t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
};

async function load(){try{await DB.open();const s=await DB.get('kv','state');if(s)S=Object.assign(S,s)}catch(e){try{const s=localStorage.getItem('gv-state');if(s)S=Object.assign(S,JSON.parse(s))}catch(_){}}}

const custTx=id=>S.tx.filter(t=>t.customerId===id);
const balance=id=>custTx(id).reduce((a,t)=>a+(t.type==='borc'?num(t.tutar):-num(t.tutar)),0);
const totalReceivable=()=>S.customers.reduce((a,c)=>a+Math.max(0,balance(c.id)),0);
const inRange=(iso,a,b)=>iso>=a&&iso<=b;
const monthRange=()=>{const d=new Date();return [toISO(new Date(d.getFullYear(),d.getMonth(),1)),toISO(new Date(d.getFullYear(),d.getMonth()+1,0))]};

/* ===================== Dönem / grafik ===================== */
function periods(kind,n){const out=[];const now=new Date();
 if(kind==='gun'){for(let i=n-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const iso=toISO(d);out.push({a:iso,b:iso,l:`${d.getDate()} ${AY[d.getMonth()]}`,ls:String(d.getDate())})}}
 else if(kind==='hafta'){const d=new Date(now);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);for(let i=n-1;i>=0;i--){const s=new Date(d);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+6);out.push({a:toISO(s),b:toISO(e),l:`${s.getDate()} ${AY[s.getMonth()]}`,ls:`${s.getDate()}/${s.getMonth()+1}`})}}
 else if(kind==='ay'){for(let i=n-1;i>=0;i--){const s=new Date(now.getFullYear(),now.getMonth()-i,1);const e=new Date(s.getFullYear(),s.getMonth()+1,0);out.push({a:toISO(s),b:toISO(e),l:`${AY[s.getMonth()]} ${String(s.getFullYear()).slice(2)}`,ls:AY[s.getMonth()]})}}
 else{for(let i=n-1;i>=0;i--){const y=now.getFullYear()-i;out.push({a:`${y}-01-01`,b:`${y}-12-31`,l:String(y),ls:String(y)})}}
 return out}
const PN={gun:14,hafta:8,ay:12,yil:5};
function sumIn(list,a,b,f){return list.filter(t=>inRange(t.date,a,b)).reduce((s,t)=>s+(f?f(t):num(t.tutar)),0)}
function chartHTML(ps,series){const max=Math.max(1,...ps.flatMap(p=>series.map(s=>s.val(p))));
 return `<div class="chart">${ps.map(p=>`<div class="g">${series.map(s=>`<div class="b ${s.cls}" style="height:${Math.max(2,Math.round(s.val(p)/max*100))}%" title="${h(p.l)}: ${money(s.val(p))}"></div>`).join('')}</div>`).join('')}</div><div class="xl">${ps.map(p=>`<div>${h(p.ls)}</div>`).join('')}</div>`}

/* ===================== Türkçe ses ayrıştırma ===================== */
const NW={sıfır:0,bir:1,iki:2,üç:3,dört:4,beş:5,altı:6,yedi:7,sekiz:8,dokuz:9,on:10,yirmi:20,otuz:30,kırk:40,elli:50,altmış:60,yetmiş:70,seksen:80,doksan:90,yüz:100,bin:1000,milyon:1000000,"bi":1,"bir buçuk":1.5};
const trLower=s=>s.replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase();
function wordsToNumber(toks){let total=0,cur=0;for(const t of toks){const v=NW[t]!==undefined?NW[t]:(/^\d+([.,]\d+)?$/.test(t)?num(t):null);if(v===null)continue;if(v===100){cur=(cur||1)*100}else if(v>=1000){cur=(cur||1)*v;total+=cur;cur=0}else cur+=v}return total+cur}
function parseSpeech(text){const raw=text;let t=trLower(text).replace(/(\d)[.,](\d{3})\b/g,'$1$2').replace(/(\d),(\d{1,2})\b/g,'$1.$2').replace(/[,!?;:]/g,' ').replace(/\.(?!\d)/g,' ').replace(/'/g,' ').replace(/\s+/g,' ').replace(/\b(\d+) (\d{3})\b/g,'$1$2').trim();
 const toks=t.split(' ');
 // sayı gruplarını birleştir
 const isN=w=>NW[w]!==undefined||/^\d+([.,]\d+)?$/.test(w);
 const groups=[];for(let i=0;i<toks.length;i++){if(isN(toks[i])){let j=i;while(j<toks.length&&isN(toks[j]))j++;const g={start:i,end:j-1,val:wordsToNumber(toks.slice(i,j)),next:toks[j]||'',next2:toks[j+1]||''};if(toks[j]==='buçuk'){g.val+=0.5;g.end=j;g.next=toks[j+1]||''}groups.push(g);i=j-1}}
 let tutar=null,palet=null,saat=null;const used=new Set();
 for(const g of groups){const nx=g.next.replace(/[a-zçğıöşü]*$/,m=>m);
  if(/^(lira|tl|liralık|lirayı|liraya|bin|₺)/.test(g.next)||/^(lira|tl)/.test(g.next2)&&g.next==='bin'){tutar=g.val;used.add(g)}
  else if(/^palet/.test(g.next)){palet=g.val;used.add(g)}
  else if(/^saat/.test(g.next)){saat=g.val;used.add(g)}}
 if(tutar===null){const g=groups.filter(g=>!used.has(g)).sort((a,b)=>b.val-a.val)[0];if(g&&g.val>=20){tutar=g.val;used.add(g)}}
 if(palet===null){const g=groups.find(g=>!used.has(g)&&g.val<20&&g.val>0);if(g&&/palet/.test(t)){palet=g.val;used.add(g)}}
 // tarih
 let date=today();if(/\bdün\b/.test(t))date=addDays(date,-1);else if(/evvelsi gün|önceki gün|evvelki gün/.test(t))date=addDays(date,-2);
 const dm=t.match(/(\d{1,2}) (ocak|şubat|mart|nisan|mayıs|haziran|temmuz|ağustos|eylül|ekim|kasım|aralık)/);if(dm){const y=new Date().getFullYear();date=`${y}-${pad(AYL.indexOf(dm[2])+1)}-${pad(+dm[1])}`}
 // tür
 let type='borc',yontem='elden';
 if(/ödeme ald|ödeme yaptı|ödedi|tahsil|aldım|parasını verdi|para verdi|havale|eft|gönderdi|yatırdı/.test(t)&&!/borç/.test(t))type='odeme';
 if(/havale|eft|iban|yatırdı|gönderdi/.test(t))yontem='havale';
 // müşteri eşleme
 const stripSuf=w=>w.replace(/(ya|ye|a|e|nın|nin|nun|nün|ın|in|un|ün|dan|den|tan|ten|da|de|ta|te|i|ı|u|ü|yı|yi|yu|yü|la|le|yla|yle|ndan|nden|na|ne|nda|nde)$/,'');
 let best=null,bs=0;
 for(const c of S.customers){const names=[c.ad,c.soyad,c.firma].filter(Boolean).map(trLower).join(' ').split(/\s+/).filter(w=>w.length>1);let sc=0;for(const n of names){for(const w of toks){if(w===n||stripSuf(w)===n||(w.length>=4&&n.startsWith(w))||(n.length>=4&&w.startsWith(n)))sc+=n===w?2:1}}if(sc>bs){bs=sc;best=c}}
 const customer=bs>0?best:null;
 // açıklama
 const verbs=t.match(/(indir|yükle|boşalt|taşı|kaldır|istif|yükledi|indirdi|boşaltt|çalış)\w*/);
 let aciklama='';
 if(type==='odeme')aciklama='Ödeme alındı';
 else if(palet!==null)aciklama=`${palet} palet ${verbs?({indir:'indirme',yükle:'yükleme',boşalt:'boşaltma',taşı:'taşıma',kaldır:'kaldırma',istif:'istifleme',çalış:'çalışma'})[verbs[1]]||verbs[0]:'iş'}`;
 else if(verbs)aciklama=({indir:'İndirme',yükle:'Yükleme',boşalt:'Boşaltma',taşı:'Taşıma',kaldır:'Kaldırma',istif:'İstifleme',çalış:'Çalışma'})[verbs[1]]||'Forklift işi';
 else aciklama='Forklift işi';
 if(saat!==null)aciklama+=` (${saat} saat)`;
 if(tutar===null&&palet!==null&&customer&&num(customer.paletFiyat)>0)tutar=palet*num(customer.paletFiyat);
 return {raw,customer,customerId:customer?customer.id:'',tutar,palet,date,type,yontem,aciklama,saat}}

async function fileToDataURL(file,max=1400){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h2=img.height;const s=Math.min(1,max/Math.max(w,h2));w=Math.round(w*s);h2=Math.round(h2*s);const c=document.createElement('canvas');c.width=w;c.height=h2;c.getContext('2d').drawImage(img,0,0,w,h2);res(c.toDataURL('image/jpeg',.72));URL.revokeObjectURL(url)};img.onerror=()=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(file)};img.src=url})}
function dekontField(existing){return `<div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--mute)">DEKONT / FOTOĞRAF (isteğe bağlı)<div id="dekPrev">${existing?`<img class="thumb" src="${existing}">`:''}</div><label class="up">${I.cam} Fotoğraf çek / seç<input type="file" accept="image/*" id="dekFile" style="display:none"></label>${existing?'<button type="button" class="lnk danger" id="dekDel" style="text-align:left">Dekontu kaldır</button>':''}</div>`}
function bindDekont(sh,state){const fi=sh.querySelector('#dekFile');if(fi)fi.onchange=async()=>{if(!fi.files[0])return;state.dataUrl=await fileToDataURL(fi.files[0]);state.removed=false;sh.querySelector('#dekPrev').innerHTML=`<img class="thumb" src="${state.dataUrl}">`};const d=sh.querySelector('#dekDel');if(d)d.onclick=()=>{state.removed=true;state.dataUrl=null;sh.querySelector('#dekPrev').innerHTML=''}}

  sel.forEach(n=>{const m=items.find(i=>i.ad===n);if(m&&saat>=num(m.sonSaat)){m.sonSaat=saat;m.sonTarih=date}});if(saat>num(f.saat))f.saat=saat;if(isNew)S.maintLog.push(o);else Object.assign(x,o);save();closeSheet();go({ftab:'bakim'});toast('Bakım kaydedildi')};
 const d=sh.querySelector('#m_del');if(d)d.onclick=(e)=>{if(!twoTap(e.currentTarget))return;S.maintLog=S.maintLog.filter(t=>t.id!==x.id);save();closeSheet();render()}}
function maintItemSheet(f,m){const isNew=!m;m=m||{periyotSaat:500,sonSaat:f.saat,sonTarih:today()};const sh=sheet(isNew?'Bakım Kalemi':'Bakım Kalemini Düzenle',`${F('BAKIM ADI','<input id="i_ad" value="'+h(m.ad||'')+'" placeholder="Örn. Yakıt filtresi">')}<div class="row">${F('PERİYOT (saat)','<input type="text" inputmode="numeric" id="i_per" value="'+h(m.periyotSaat)+'">')}${F('SON YAPILAN SAAT','<input type="text" inputmode="numeric" id="i_son" value="'+h(m.sonSaat)+'">')}</div>${F('SON YAPILMA TARİHİ','<input type="date" id="i_tar" value="'+h(m.sonTarih||'')+'">')}<button class="btn bd" id="i_save">Kaydet</button>${!isNew?'<button class="btn sm danger" id="i_del">Kalemi sil</button>':''}`);
 $('#i_save',sh).onclick=()=>{const ad=$('#i_ad',sh).value.trim();if(!ad){toast('Ad girin');return}const o={id:m.id||uid(),forkliftId:f.id,ad,periyotSaat:num($('#i_per',sh).value)||500,sonSaat:num($('#i_son',sh).value)||0,sonTarih:$('#i_tar',sh).value};if(isNew)S.maint.push(o);else Object.assign(m,o);save();closeSheet();render()};
 const d=sh.querySelector('#i_del');if(d)d.onclick=(e)=>{if(!twoTap(e.currentTarget))return;S.maint=S.maint.filter(t=>t.id!==m.id);save();closeSheet();render()}}
function expenseSheet(f,x){const isNew=!x;x=x||{date:today()};const sh=sheet(isNew?'Masraf Ekle':'Masrafı Düzenle',`${F('AÇIKLAMA','<input id="e_ack" value="'+h(x.aciklama||'')+'" placeholder="Örn. 2 ön lastik">')}<div class="row">${F('TARİH','<input type="date" id="e_date" value="'+h(x.date)+'">')}${F('TUTAR (₺)','<input type="text" inputmode="decimal" id="e_tutar" value="'+h(x.tutar||'')+'">')}</div><button class="btn bd" id="e_save">Kaydet</button>${!isNew?'<button class="btn sm danger" id="e_del">Sil</button>':''}`);
 $('#e_save',sh).onclick=()=>{const tutar=num($('#e_tutar',sh).value);if(!tutar){toast('Tutar girin');return}const o={id:x.id||uid(),forkliftId:f.id,date:$('#e_date',sh).value||today(),aciklama:$('#e_ack',sh).value.trim()||'Masraf',tutar};if(isNew)S.expenses.push(o);else Object.assign(x,o);save();closeSheet();go({ftab:'masraf'})};
 const d=sh.querySelector('#e_del');if(d)d.onclick=(e)=>{if(!twoTap(e.currentTarget))return;S.expenses=S.expenses.filter(t=>t.id!==x.id);save();closeSheet();render()}}

/* ---- Borçlarım ---- */
const credOptions=sel=>`<option value="">— Seç —</option>${S.creditors.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${h(c.ad)}</option>`).join('')}<option value="__new">+ Yeni kişi/firma…</option>`;
function creditorForm(c,after){const isNew=!c;c=c||{};const sh=sheet(isNew?'Kime borçluyum?':'Düzenle',`${F('KİŞİ / FİRMA','<input id="c_ad" value="'+h(c.ad||'')+'" placeholder="Örn. Petrol Ofisi – Hadımköy">')}${F('NE İÇİN','<input id="c_ack" value="'+h(c.aciklama||'')+'" placeholder="Yakıt, servis, yedek parça…">')}${F('TELEFON','<input id="c_tel" type="tel" value="'+h(c.tel||'')+'">')}<button class="btn bd" id="c_save">Kaydet</button>${!isNew?'<button class="btn sm danger" id="c_del">Sil</button>':''}`);
 $('#c_save',sh).onclick=()=>{const ad=$('#c_ad',sh).value.trim();if(!ad){toast('Ad girin');return}const o={id:c.id||uid(),ad,aciklama:$('#c_ack',sh).value.trim(),tel:$('#c_tel',sh).value.trim()};if(isNew)S.creditors.push(o);else Object.assign(c,o);save();closeSheet();render();if(after)after(o)};
 const d=sh.querySelector('#c_del');if(d)d.onclick=(e)=>{if(!twoTap(e.currentTarget))return;S.creditors=S.creditors.filter(x=>x.id!==c.id);S.ctx=S.ctx.filter(t=>t.creditorId!==c.id);save();closeSheet();render()}}
function ctxSheet(type,creditorId,t){const isNew=!t;t=t||{type,date:today()};const st={dataUrl:null,removed:false};const isB=t.type==='borc';
 const sh=sheet(isNew?(isB?'Borç Ekle':'Borç Ödedim'):(isB?'Borcu Düzenle':'Ödemeyi Düzenle'),`${F('KİME','<select id="x_cred">'+credOptions(t.creditorId||creditorId)+'</select>')}<div class="row">${F('TARİH','<input type="date" id="x_date" value="'+h(t.date)+'">')}${F('TUTAR (₺)','<input type="text" inputmode="decimal" id="x_tutar" value="'+h(t.tutar||'')+'">')}</div>${F('AÇIKLAMA','<input id="x_ack" value="'+h(t.aciklama||'')+'" placeholder="'+(isB?'Örn. 120 L mazot':'Örn. havale ile')+'">')}${isB?F('VADE (ödeme günü)','<input type="date" id="x_vade" value="'+h(t.vade||'')+'">'):`<div id="dekWrap">${dekontField(null)}</div>`}<button class="btn ${isB?'bd':'bg'}" id="x_save">Kaydet</button>${!isNew?'<button class="btn sm danger" id="x_del">Sil</button>':''}`);
 $('#x_cred',sh).onchange=e=>{if(e.target.value==='__new'){closeSheet();creditorForm(null,o=>ctxSheet(type,o.id))}};
 if(!isB){(async()=>{if(t.dekontId){const d=await getFile(t.dekontId);if(d){$('#dekWrap',sh).innerHTML=dekontField(d);bindDekont(sh,st)}}})();bindDekont(sh,st)}
 $('#x_save',sh).onclick=async()=>{const cid=$('#x_cred',sh).value;if(!cid||cid==='__new'){toast('Kişi seçin');return}const tutar=num($('#x_tutar',sh).value);if(!tutar){toast('Tutar girin');return}const o={id:t.id||uid(),creditorId:cid,type:t.type,date:$('#x_date',sh).value||today(),tutar,aciklama:$('#x_ack',sh).value.trim(),vade:isB?$('#x_vade',sh).value:'',dekontId:t.dekontId||'',created:t.created||Date.now()};if(!isB){if(st.removed&&o.dekontId){await delFile(o.dekontId);o.dekontId=''}if(st.dataUrl){o.dekontId=o.dekontId||uid();await putFile(o.dekontId,st.dataUrl)}}if(isNew)S.ctx.push(o);else Object.assign(t,o);save();closeSheet();render();toast('Kaydedildi')};
 const d=sh.querySelector('#x_del');if(d)d.onclick=async(e)=>{if(!twoTap(e.currentTarget))return;await delFile(t.dekontId);S.ctx=S.ctx.filter(x=>x.id!==t.id);save();closeSheet();render()}}
function creditorSheet(c){const txs=S.ctx.filter(t=>t.creditorId===c.id).sort((a,b)=>b.date.localeCompare(a.date));const b=credBalance(c.id);const sh=sheet(c.ad,`<div class="card"><div class="grow"><div class="n">${h(c.aciklama||'')}</div><div class="m">${h(c.tel||'')}</div></div><div class="amt ${b>0?'pos':'zero'}">${money(b)}</div>${c.tel?`<a class="ib light" href="tel:${h(c.tel.replace(/\s/g,''))}">${I.phone}</a>`:''}<button class="ib light" id="ce">${I.edit}</button></div><div class="row"><button class="btn sm bw" id="cp">${I.ok} Ödedim</button><button class="btn sm bd" id="cb">${I.plus} Borç Ekle</button></div><div class="lst">${txs.map(t=>`<button class="card" data-ct="${t.id}"><div class="ic" style="background:${t.type==='borc'?'var(--acc-bg)':'var(--green-bg)'};color:${t.type==='borc'?'var(--red)':'var(--green)'}">${t.type==='borc'?I.plus:I.ok}</div><div class="grow"><div class="n" style="font-size:14px">${h(t.aciklama||(t.type==='borc'?'Borç':'Ödeme'))}</div><div class="m">${fdate(t.date)}${t.vade?' · vade '+fdateS(t.vade):''}${t.dekontId?' · dekont var':''}</div></div><div class="amt ${t.type==='borc'?'pos':'neg'}" style="font-size:14px">${t.type==='borc'?'+':'−'}${money(t.tutar)}</div></button>`).join('')||'<div class="empty">Kayıt yok.</div>'}</div>`);
 $('#ce',sh).onclick=()=>{closeSheet();creditorForm(c)};$('#cp',sh).onclick=()=>{closeSheet();ctxSheet('odeme',c.id)};$('#cb',sh).onclick=()=>{closeSheet();ctxSheet('borc',c.id)};
 sh.querySelectorAll('[data-ct]').forEach(bt=>bt.onclick=()=>{const t=S.ctx.find(x=>x.id===bt.dataset.ct);closeSheet();ctxSheet(t.type,t.creditorId,t)})}

/* ---- Ayarlar / yedek ---- */
async function exportBackup(){const files={};try{const keys=DB.db?await DB.keys('files'):[];for(const k of keys)files[k]=await DB.get('files',k)}catch(_){}
 const data=JSON.stringify({app:'gurses-veresiye',v:1,at:new Date().toISOString(),state:S,files});shareText(`gurses-veresiye-yedek-${today()}.json`,data,'application/json')}
async function shareText(name,text,type){const blob=new Blob([text],{type});const file=new File([blob],name,{type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function importBackup(file){const fr=new FileReader();fr.onload=async()=>{try{const d=JSON.parse(fr.result);if(d.app!=='gurses-veresiye')throw 0;S=Object.assign({customers:[],tx:[],reminders:[],forklifts:[],fuel:[],maint:[],maintLog:[],expenses:[],creditors:[],ctx:[],settings:{}},d.state);for(const k in (d.files||{}))await putFile(k,d.files[k]);save();closeSheet();render();toast('Yedek yüklendi')}catch(e){toast('Geçersiz yedek dosyası')}};fr.readAsText(file)}
function settingsSheet(){const sh=sheet('Ayarlar',`${F('FİRMA ADI (üstte görünür)','<input id="s_isim" value="'+h(S.settings.isim||'')+'">')}<button class="btn sm bd" id="s_save">Kaydet</button><hr>
 <div class="card col"><b>Yedekleme</b><div class="note">Veriler yalnızca bu telefonda durur. Ara sıra yedek alıp iCloud Drive / Dosyalar'a kaydedin; telefon değişince "Yedek yükle" ile geri getirirsiniz. Dekont fotoğrafları yedeğe dahildir.</div><button class="btn sm bw" id="s_exp">Yedek al (paylaş / kaydet)</button><label class="btn sm bw">Yedek yükle<input type="file" accept=".json,application/json" id="s_imp" style="display:none"></label></div>
 <div class="card col"><b>Özet</b><div class="dl"><span>Müşteri</span><b>${S.customers.length}</b></div><div class="dl"><span>İşlem</span><b>${S.tx.length}</b></div><div class="dl"><span>Forklift / yakıt / bakım</span><b>${S.forklifts.length} / ${S.fuel.length} / ${S.maintLog.length}</b></div></div>
 <div class="card col"><b>Ana ekrana ekleme</b><div class="note">Safari'de alttaki <b>Paylaş</b> tuşu → <b>Ana Ekrana Ekle</b>. Uygulama ikonuyla açılır, internet olmadan da çalışır.</div></div>
 <div class="note" style="text-align:center">Gürses Veresiye · sürüm 1.0</div>`);
 $('#s_save',sh).onclick=()=>{S.settings.isim=$('#s_isim',sh).value.trim();save();closeSheet();render()};$('#s_exp',sh).onclick=exportBackup;$('#s_imp',sh).onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0])}}

/* ===================== Olaylar ===================== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act],[data-cust],[data-tx],[data-cper],[data-per],[data-ftab],[data-maint],[data-mlog],[data-fuel],[data-exp],[data-cred],[data-ctx]');if(!t||$('#sheetRoot').contains(t))return;const d=t.dataset;
 if(d.tab){go({tab:d.tab,customerId:null});return}
 if(d.cust){go({customerId:d.cust});return}
 if(d.cper){go({cperiod:d.cper});return}if(d.per){go({period:d.per});return}if(d.ftab){go({ftab:d.ftab});return}
 if(d.tx){const tx=S.tx.find(x=>x.id===d.tx);if(tx)tx.type==='odeme'?paymentSheet(tx.customerId,tx):debtSheet(tx.customerId,tx);return}
 const f=S.forklifts.find(x=>x.id===V.forkliftId);
 if(d.maint){const m=S.maint.find(x=>x.id===d.maint);if(m)maintItemSheet(f,m);return}
 if(d.mlog){const m=S.maintLog.find(x=>x.id===d.mlog);if(m)maintLogSheet(f,m);return}
 if(d.fuel){const m=S.fuel.find(x=>x.id===d.fuel);if(m)fuelSheet(f,m);return}
 if(d.exp){const m=S.expenses.find(x=>x.id===d.exp);if(m)expenseSheet(f,m);return}
 if(d.cred){const c=S.creditors.find(x=>x.id===d.cred);if(c)creditorSheet(c);return}
 if(d.ctx){const x=S.ctx.find(y=>y.id===d.ctx);if(x)ctxSheet(x.type,x.creditorId,x);return}
 const c=S.customers.find(x=>x.id===V.customerId);
 switch(d.act){
  case 'back':go({customerId:null});break;
  case 'settings':settingsSheet();break;
  case 'newCustomer':customerForm();break;
  case 'editCustomer':customerForm(c);break;
  case 'voice':voiceSheet(V.customerId);break;
  case 'payment':paymentSheet(V.customerId);break;
  case 'reminders':remindersSheet();break;
  case 'reminderFor':reminderSheet(V.customerId);break;
  case 'newFork':case 'editFork':forkForm(d.act==='editFork'?f:null);break;
  case 'setHours':hoursSheet(f);break;
  case 'newFuel':f?fuelSheet(f):forkForm();break;
  case 'newMaintLog':f?maintLogSheet(f):forkForm();break;
  case 'newMaintItem':maintItemSheet(f);break;
  case 'newExpense':expenseSheet(f);break;
  case 'newCreditor':creditorForm();break;
  case 'addDebt':ctxSheet('borc');break;
  case 'payDebt':ctxSheet('odeme');break;
 }});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;const l=$('#custList');if(l)l.innerHTML=customerListHTML()}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-forkSel'))go({forkliftId:e.target.value})});

/* ===================== Başlat ===================== */
(async()=>{await load();render();
 if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
 if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}})();
</script>
